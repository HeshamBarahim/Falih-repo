// Define repositories and dependencies for the build script
buildscript {
    repositories {
        google()       // Google's Maven repository
        mavenCentral() // Maven Central repository
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1' // AGP version
    }
}

// Define repositories for all projects
allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Configure build directories
rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// Register a "clean" task to delete the build directory
tasks.register("clean", Delete) {
    delete rootProject.buildDir
}