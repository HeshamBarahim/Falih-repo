name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9 # the version this code was validated on; bump deliberately
          channel: stable
          cache: true
      - run: flutter pub get
      # Info-level lints (deprecations) do not fail the build; errors and warnings do.
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  functions:
    name: Cloud Functions typecheck + unit tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  rules-and-adapters:
    name: Firebase rules + adapter tests (emulators)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            functions/package-lock.json
            rules-tests/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        working-directory: functions
      - run: npm ci
        working-directory: rules-tests
      - run: npm test
        working-directory: rules-tests

  android-build:
    name: Android debug build (toolchain check)
    runs-on: ubuntu-latest
    # Not validated locally (no Android SDK on the dev server). Failures here point at
    # the old Gradle/AGP/Kotlin setup (audit issue 08). Remove continue-on-error once green.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --debug
